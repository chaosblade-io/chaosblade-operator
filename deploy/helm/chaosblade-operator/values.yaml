# Default values for chaosblade.

# chaosblade-operator
operator:
  repository: ghcr.io/chaosblade-io/chaosblade-operator
  version: 1.8.0-rca
  # image.pullPolicy: must be Always|IfNotPresent|Never
  pullPolicy: IfNotPresent
  # qps of kubernetes client
  qps: 20
  reconcileCount: 20

blade:
  repository: ghcr.io/chaosblade-io/chaosblade-tool
  version: 1.8.0-rca
  pullPolicy: IfNotPresent
  downloadUrl: ""

env:
  logLevel: info

webhook:
  enable: true

daemonset:
  enable: true
  # Must match DaemonSet metadata.name, pod labels app/name, and container name. Operator uses the same value for exec and for listing tool pods.
  name: chaosblade-tool

remove:
  blade:
    interval: 72h

network:
  host: false
  dns:
    policy: ClusterFirst
